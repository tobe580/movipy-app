<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>MOVIPY</title>
<style>
*{box-sizing:border-box}
html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#111}
#app{position:fixed;inset:0}
#movipy-frame{display:block;width:100%;height:100%;border:0;background:#fff}
#loading{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;background:#111;color:#fff;font:600 20px Arial,sans-serif}
#loading.hidden{display:none}
</style>
</head>
<body>
<main id="app">
<div id="loading">🚕 MOVIPY</div>
<iframe
 id="movipy-frame"
 title="MOVIPY"
 src="https://script.google.com/macros/s/AKfycby6DOBMVN1kmyWndYzjKLoONhYXP8NWMh8gU5yd9JphEAcx-BK1QoaCXUDnolvzOR5DhA/exec"
 allow="geolocation; camera; microphone"
 allowfullscreen>
</iframe>
</main>
<script>
(function(){
 const frame=document.getElementById('movipy-frame');
 const loading=document.getElementById('loading');
 frame.addEventListener('load',function(){
   loading.classList.add('hidden');
 });
})();
</script>
</body>
</html>
